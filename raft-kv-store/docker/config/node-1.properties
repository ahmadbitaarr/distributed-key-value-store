# All nodes share identical static membership and deadlines.
cluster.id=raftkv-compose
cluster.leader.id=n1
local.node.id=n1
cluster.member.n1=node-1:50051
cluster.member.n2=node-2:50051
cluster.member.n3=node-3:50051
server.bind.host=0.0.0.0
server.bind.port=50051
storage.wal.directory=/var/lib/raftkv
rpc.client.deadline.ms=5000
rpc.replication.deadline.ms=5000
rpc.status.deadline.ms=3000
server.shutdown.grace.ms=20000
rpc.max.inbound.bytes=12582912

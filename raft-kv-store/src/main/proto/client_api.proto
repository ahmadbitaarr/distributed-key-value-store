syntax = "proto3";
package raftkv.client.v1;
option java_package = "io.github.ahmadbitaarr.raftkv.rpc.generated.client.v1";
option java_multiple_files = true;
option java_outer_classname = "ClientApiProto";

enum ResultCode {
  RESULT_CODE_UNSPECIFIED = 0;
  RESULT_CODE_OK = 1;
  RESULT_CODE_NOT_FOUND = 2;
  RESULT_CODE_NOT_LEADER = 3;
  RESULT_CODE_NO_QUORUM = 4;
  RESULT_CODE_REQUEST_ID_CONFLICT = 5;
  RESULT_CODE_NOT_READY = 6;
}

message LeaderHint {
  string leader_id = 1;
  string host = 2;
  uint32 port = 3;
}

// Mutating requests require request_id and explicitly present value, including empty bytes.
message PutRequest {
  string request_id = 1;
  string key = 2;
  optional bytes value = 3;
}

message GetRequest {
  string key = 1;
}

message DeleteRequest {
  string request_id = 1;
  string key = 2;
}

// request_id must echo the originating PUT/DELETE request ID, even on failure.
message MutationResponse {
  ResultCode code = 1;
  string request_id = 2;
  optional int64 commit_index = 3;
  LeaderHint leader_hint = 4;
  string message = 5;
}

// In baseline v1 only OK, NOT_FOUND, NOT_LEADER and NOT_READY are valid for GET.
// A recovered, ready configured leader may read committed/applied state without a fresh quorum.
message GetResponse {
  ResultCode code = 1;
  string key = 2;
  optional bytes value = 3;
  optional int64 commit_index = 4;
  LeaderHint leader_hint = 5;
  string message = 6;
}

service KeyValueService {
  rpc Put(PutRequest) returns (MutationResponse);
  rpc Get(GetRequest) returns (GetResponse);
  rpc Delete(DeleteRequest) returns (MutationResponse);
}
